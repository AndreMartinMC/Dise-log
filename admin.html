<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo | Dise.Log</title>
<link rel="icon" type="image/jpeg" href="assets/logo de la pagina web.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --primary:#FF5C89;
    --primary-dark:#df416f;
    --primary-soft:#ffe2ea;
    --page-bg:#FDA8BF;
    --dark:#172033;
    --gray:#667085;
    --white:#ffffff;
    --shadow:0 10px 30px rgba(77,20,42,.08);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,var(--page-bg) 0%,#fff7fa 50%,#ffffff 100%);
    color:var(--dark);
    min-height:100vh;
}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:16px 8%;
    background:rgba(255,255,255,.9);
    border-bottom:1px solid rgba(255,92,137,.22);
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);
}
.brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:24px;
    font-weight:800;
    color:var(--primary);
}
.brand img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.brand span{color:var(--dark)}

.nav-links{
    display:flex;
    align-items:center;
    gap:16px;
    list-style:none;
}
.nav-links a{
    font-size:14px;
    font-weight:700;
    color:#333b4c;
    transition:color .2s;
}
.nav-links a:hover{color:var(--primary)}
.btn-logout{
    background:var(--primary);
    color:#fff;
    border:0;
    padding:8px 14px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
}

.main-container{
    max-width:1200px;
    margin:32px auto;
    padding:0 24px;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
}
.page-title h1{
    font-size:2.2rem;
    font-weight:800;
    color:var(--dark);
}
.page-title p{
    color:var(--gray);
    font-size:14px;
    margin-top:4px;
}
.live-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#e6f4ea;
    color:#137333;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}
.live-badge span{
    width:8px;
    height:8px;
    background:#1e8e3e;
    border-radius:50%;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px;
    margin-bottom:32px;
}
.stat-card{
    background:#fff;
    border:1px solid rgba(255,92,137,.2);
    border-radius:12px;
    padding:18px 14px;
    box-shadow:0 8px 20px rgba(77,20,42,.06);
}
.stat-card .val{
    font-size:1.7rem;
    font-weight:800;
    color:var(--primary);
    margin-bottom:4px;
}
.stat-card .lbl{
    font-size:11px;
    font-weight:700;
    color:var(--gray);
    text-transform:uppercase;
}

.content-box{
    background:#fff;
    border-radius:12px;
    border:1px solid rgba(255,92,137,.2);
    box-shadow:0 10px 30px rgba(77,20,42,.08);
    overflow:hidden;
}

.filter-bar{
    padding:18px 24px;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    border-bottom:1px solid #eee;
}
.search-input{
    padding:8px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    min-width:240px;
    font-size:13px;
}
.actions-group{
    display:flex;
    gap:10px;
}
.btn-action{
    padding:8px 14px;
    border-radius:8px;
    border:0;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
}
.btn-reset{background:var(--primary-soft);color:var(--primary)}

.table-wrapper{
    overflow-x:auto;
    min-height:220px;
}
table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
}
th{
    background:var(--primary);
    color:#fff;
    padding:12px 18px;
    font-size:13px;
    font-weight:700;
}
td{
    padding:14px 18px;
    border-bottom:1px solid #eee;
    font-size:13px;
}
.status-pill{
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}
.status-entregado{background:#dcfce7;color:#15803d}
.status-pendiente{background:#fef3c7;color:#d97706}

@media(max-width:768px){
    .stats-grid{grid-template-columns:repeat(2, 1fr);}
    .filter-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html"><img src="assets/logo de la pagina web.jpeg" alt="">DISE<span>.LOG</span></a>
    <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="solicitar.html">Solicitar Diseño</a></li>
        <li><button class="btn-logout" onclick="window.location.href='index.html'">Cerrar sesión</button></li>
    </ul>
</header>

<main class="main-container">
    <div class="page-header">
        <div class="page-title">
            <h1>Panel Administrativo</h1>
            <p>Proyectos del portafolio y solicitudes en tiempo real.</p>
        </div>
        <div class="live-badge"><span></span> Sincronizado</div>
    </div>

    <!-- TARJETAS CON DATOS REALES -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="val" id="totalPedidos">0</div>
            <div class="lbl">Proyectos Totales</div>
        </div>
        <div class="stat-card">
            <div class="val" id="pendientes">0</div>
            <div class="lbl">Pendientes</div>
        </div>
        <div class="stat-card">
            <div class="val" id="enProceso">0</div>
            <div class="lbl">En Proceso</div>
        </div>
        <div class="stat-card">
            <div class="val" id="entregados">0</div>
            <div class="lbl">Entregados</div>
        </div>
        <div class="stat-card">
            <div class="val" id="disenosLogo">0</div>
            <div class="lbl">Diseños Logo</div>
        </div>
        <div class="stat-card">
            <div class="val" id="videosPromo">0</div>
            <div class="lbl">Videos Promo</div>
        </div>
        <div class="stat-card">
            <div class="val" id="ingresos">$0</div>
            <div class="lbl">Ingresos Est.</div>
        </div>
    </div>

    <div class="content-box">
        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar proyecto o cliente..." onkeyup="filtrarTabla()">
            <div class="actions-group">
                <button class="btn-action btn-reset" onclick="restablecerDatos()">Restablecer Portafolio</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente / Proyecto</th>
                        <th>Servicio</th>
                        <th>Presupuesto</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="pedidosTabla">
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
// Proyectos ya realizados de la página principal
const proyectosBase = [
    { cliente: "Filazero", servicio: "Video Promocional", presupuesto: "$20", estado: "Entregado", fecha: "15/08/2026" },
    { cliente: "Check Alarms", servicio: "Video Promocional", presupuesto: "$20", estado: "Entregado", fecha: "16/08/2026" },
    { cliente: "Ecotech", servicio: "Video Promocional (Pack 2)", presupuesto: "$40", estado: "Entregado", fecha: "17/08/2026" },
    { cliente: "QReady", servicio: "Video Promocional", presupuesto: "$20", estado: "Entregado", fecha: "18/08/2026" },
    { cliente: "Dise.Log", servicio: "Diseño de Logo & Branding", presupuesto: "$20", estado: "Entregado", fecha: "19/08/2026" }
];

function cargarDashboard() {
    let solicitudesNuevas = JSON.parse(localStorage.getItem("diselog_pedidos") || "[]");
    
    // Unir proyectos realizados con solicitudes de la web
    let todosLosProyectos = [...proyectosBase, ...solicitudesNuevas];

    const tbody = document.getElementById("pedidosTabla");
    tbody.innerHTML = "";

    let total = todosLosProyectos.length;
    let pendientes = 0;
    let proceso = 0;
    let entregados = 0;
    let logos = 0;
    let videos = 0;
    let ingresos = 0;

    todosLosProyectos.forEach((p, i) => {
        const est = (p.estado || "Pendiente").toLowerCase();
        const serv = (p.servicio || "").toLowerCase();
        const val = parseFloat((p.presupuesto || "").replace(/[^0-9.]/g, "")) || 0;

        ingresos += val;

        if (est.includes("entregado")) entregados++;
        else if (est.includes("proceso")) proceso++;
        else pendientes++;

        if (serv.includes("logo") || serv.includes("branding")) logos++;
        if (serv.includes("video")) videos++;

        const isEntregado = est.includes("entregado");
        const badgeClass = isEntregado ? "status-entregado" : "status-pendiente";

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><strong>#${i + 1}</strong></td>
            <td><strong>${p.cliente || p.nombre}</strong></td>
            <td>${p.servicio}</td>
            <td>${p.presupuesto}</td>
            <td><span class="status-pill ${badgeClass}">${p.estado}</span></td>
            <td>${p.fecha}</td>
        `;
        tbody.appendChild(tr);
    });

    // Actualizar las métricas
    document.getElementById("totalPedidos").textContent = total;
    document.getElementById("pendientes").textContent = pendientes;
    document.getElementById("enProceso").textContent = proceso;
    document.getElementById("entregados").textContent = entregados;
    document.getElementById("disenosLogo").textContent = logos;
    document.getElementById("videosPromo").textContent = videos;
    document.getElementById("ingresos").textContent = `$${ingresos}`;
}

function filtrarTabla() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const filas = document.querySelectorAll("#pedidosTabla tr");
    filas.forEach(fila => {
        const texto = fila.textContent.toLowerCase();
        fila.style.display = texto.includes(input) ? "" : "none";
    });
}

function restablecerDatos() {
    if (confirm("¿Quieres limpiar las pruebas y dejar solo los trabajos del portafolio?")) {
        localStorage.removeItem("diselog_pedidos");
        cargarDashboard();
    }
}

document.addEventListener("DOMContentLoaded", cargarDashboard);
window.addEventListener("storage", cargarDashboard);
</script>

</body>
</html>
